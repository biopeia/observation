name: Add new issues to Biopeia Project 1

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  add-to-project:
    uses: biopeia/.github/.github/workflows/project-1-auto-add-issue.yml@d6bc81c9ba78b185983f1d82026ce2be8bbe0a61
    with:
      app_id: ${{ vars.PROJECT_1_INTAKE_APP_ID }}
      project_id: ${{ vars.PROJECT_1_NODE_ID }}
    secrets:
      app_private_key: ${{ secrets.PROJECT_1_INTAKE_APP_PRIVATE_KEY }}
