name: Promote validated agentctl candidate

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: promote-main
  cancel-in-progress: false

jobs:
  promote:
    name: promote-validated-candidate
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'agentctl/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify candidate authority and protected surfaces
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$HEAD_BRANCH"

          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse "origin/$HEAD_BRANCH")" = "$HEAD_SHA"

          MESSAGE="$(git log -1 --pretty=%B "$HEAD_SHA")"
          grep -q '^Governance-Class:' <<<"$MESSAGE"
          CLASS="$(sed -n 's/^Governance-Class:[[:space:]]*//p' <<<"$MESSAGE" | tail -n1)"

          if [ "$CLASS" != "ORDINARY" ]; then
            echo "REVIEW REQUIRED — only ORDINARY candidates are auto-promoted"
            exit 1
          fi

          MERGE_BASE="$(git merge-base origin/main "$HEAD_SHA")"
          CHANGED="$(git diff --name-only "$MERGE_BASE" "$HEAD_SHA")"
          if grep -Eq '^(\.github/|docs/governance/|scripts/agentctl\.py$|scripts/governance/|tests/governance/|AGENTS\.md$|CLAUDE\.md$|\.pre-commit-config\.yaml$|pyproject\.toml$|pyrightconfig\.json$|uv\.lock$)' <<<"$CHANGED"; then
            echo "REVIEW REQUIRED — candidate changes the trusted validation/governance control plane"
            exit 1
          fi

          PR_NUMBER=$(gh pr list \
            --head "$HEAD_BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            echo "BLOCKED — governed candidate has no open PR targeting main"
            exit 1
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Rebase stale candidate and request fresh CI
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$HEAD_BRANCH"
          CURRENT_MAIN="$(git rev-parse origin/main)"
          REMOTE_HEAD="$(git rev-parse "origin/$HEAD_BRANCH")"

          test "$REMOTE_HEAD" = "$HEAD_SHA"

          PARENT="$(git rev-parse "$HEAD_SHA^")"
          COMMIT_COUNT="$(git rev-list --count "$CURRENT_MAIN..$HEAD_SHA")"

          if [ "$PARENT" = "$CURRENT_MAIN" ] && [ "$COMMIT_COUNT" = "1" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            echo "candidate is current with main"
            exit 0
          fi

          echo "main advanced after candidate validation; rebasing candidate automatically"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$HEAD_BRANCH" "$HEAD_SHA"

          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "CONFLICT — automatic rebase failed; human or agent resolution required"
            exit 1
          fi

          NEW_HEAD="$(git rev-parse HEAD)"
          git push \
            --force-with-lease="refs/heads/$HEAD_BRANCH:$HEAD_SHA" \
            origin "HEAD:refs/heads/$HEAD_BRANCH"

          echo "fresh=false" >> "$GITHUB_OUTPUT"
          echo "candidate rebased to $NEW_HEAD; new candidate CI will validate the composed tree"

      - name: Merge current validated ordinary candidate through its PR
        if: steps.freshness.outputs.fresh == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.verify.outputs.pr_number }}
        run: |
          set -euo pipefail
          git fetch origin main "$HEAD_BRANCH"
          EXPECTED_MAIN="$(git rev-parse origin/main)"

          if gh pr merge "$PR_NUMBER" --rebase --delete-branch; then
            echo "ordinary candidate promoted through PR #$PR_NUMBER"
            exit 0
          fi

          git fetch origin main "$HEAD_BRANCH"
          CURRENT_MAIN="$(git rev-parse origin/main)"
          CURRENT_HEAD="$(git rev-parse "origin/$HEAD_BRANCH")"

          if [ "$CURRENT_MAIN" != "$EXPECTED_MAIN" ] && [ "$CURRENT_HEAD" = "$HEAD_SHA" ]; then
            echo "main advanced during promotion; rebasing candidate for automatic revalidation"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -B "$HEAD_BRANCH" "$HEAD_SHA"

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "CONFLICT — automatic rebase failed after integration race"
              exit 1
            fi

            git push \
              --force-with-lease="refs/heads/$HEAD_BRANCH:$HEAD_SHA" \
              origin "HEAD:refs/heads/$HEAD_BRANCH"
            echo "candidate updated; fresh CI will trigger the next serialized promotion attempt"
            exit 0
          fi

          echo "BLOCKED — PR merge failed without a main-advance race; inspect branch rules or PR state"
          exit 1
