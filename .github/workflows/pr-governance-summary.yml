name: Governed PR Summary

on:
  # Run from the trusted default-branch workflow after candidate CI completes.
  # Candidate code is fetched only as data, never executed with this write token.
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-governance-summary-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  summarize:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout trusted governance code from main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Locate current PR for candidate
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          PR_JSON=$(gh pr list \
            --head "$HEAD_BRANCH" \
            --base main \
            --state open \
            --json number,baseRefOid,headRefOid \
            --jq '.[0] // empty')

          if [ -z "$PR_JSON" ]; then
            echo "No open PR for $HEAD_BRANCH; nothing to summarize."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_NUMBER=$(jq -r '.number' <<<"$PR_JSON")
          BASE_SHA=$(jq -r '.baseRefOid' <<<"$PR_JSON")
          CURRENT_HEAD=$(jq -r '.headRefOid' <<<"$PR_JSON")

          if [ "$CURRENT_HEAD" != "$HEAD_SHA" ]; then
            echo "Candidate advanced from $HEAD_SHA to $CURRENT_HEAD; stale workflow_run ignored."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Fetch candidate commit as data
        if: steps.pr.outputs.found == 'true'
        shell: bash
        run: git fetch origin "$HEAD_SHA"

      - name: Read current PR body
        if: steps.pr.outputs.found == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: gh pr view "$PR_NUMBER" --json body --jq .body > /tmp/pr-body.md

      - name: Render governed summary from trusted planner
        if: steps.pr.outputs.found == 'true'
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: >-
          python scripts/governance/pr_summary.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --body-file /tmp/pr-body.md
          --output /tmp/pr-body-updated.md

      - name: Update PR body
        if: steps.pr.outputs.found == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: gh pr edit "$PR_NUMBER" --body-file /tmp/pr-body-updated.md
