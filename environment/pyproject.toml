[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "environment"
version = "0.90.0"
description = "Environment domain: world state, laws, ground truth and observable signals"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# environment.physics3d adds fixtures to a scene it is handed; it imports no engine.
physics3d = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["environment*"]
