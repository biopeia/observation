[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modality"
version = "0.90.0"
description = "Modality domain: signal channels between an organism and whatever it is coupled to"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# modality.vision casts its rays with NumPy; it uses no physics engine.
vision = ["numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["modality*"]
