[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "observation"
version = "0.1.0"
description = "Passive, transport-neutral runtime observation projections"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Provisional"
authors = [{ name = "Biopeia contributors" }]
dependencies = ["rfc8785==0.1.4"]

[project.optional-dependencies]
test = ["pytest>=9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
