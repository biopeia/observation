<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;margin:0}.mono{font-family:var(--font-mono);font-variation-settings:"wdth" 87.5;font-size:10.5px;color:var(--ink-3)}.lbl{font:var(--type-label);font-variation-settings:"wdth" 87.5;text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--ink-3)}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:56px;box-shadow:inset 0 0 0 1px rgba(24,32,43,.08)}.grid{display:grid;gap:12px}</style></head><body><div class="grid" style="grid-template-columns:repeat(4,1fr)"><div class="sw"><div class="chip" style="background:var(--ink-1)"></div><div style="font:500 12px/1.2 var(--font-sans)">body · 15.6:1</div><div class="mono">--ink-1</div></div><div class="sw"><div class="chip" style="background:var(--ink-2)"></div><div style="font:500 12px/1.2 var(--font-sans)">secondary · 10:1</div><div class="mono">--ink-2</div></div><div class="sw"><div class="chip" style="background:var(--ink-3)"></div><div style="font:500 12px/1.2 var(--font-sans)">meta · 5.9:1</div><div class="mono">--ink-3</div></div><div class="sw"><div class="chip" style="background:var(--ink-4)"></div><div style="font:500 12px/1.2 var(--font-sans)">decorative only</div><div class="mono">--ink-4</div></div></div></body></html>
