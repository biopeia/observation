<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;margin:0}.mono{font-family:var(--font-mono);font-variation-settings:"wdth" 87.5;font-size:10.5px;color:var(--ink-3)}.lbl{font:var(--type-label);font-variation-settings:"wdth" 87.5;text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--ink-3)}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:56px;box-shadow:inset 0 0 0 1px rgba(24,32,43,.08)}.grid{display:grid;gap:12px}</style></head><body><div class="grid" style="grid-template-columns:1fr 1fr 2fr;align-items:start"><div class="sw"><div class="chip" style="background:var(--brand-leaf)"></div><div style="font:500 12px/1.2 var(--font-sans)">leaf</div><div class="mono">--brand-leaf</div></div><div class="sw"><div class="chip" style="background:var(--brand-cell)"></div><div style="font:500 12px/1.2 var(--font-sans)">cell</div><div class="mono">--brand-cell</div></div><div style="font:var(--type-meta);color:var(--ink-2);padding-top:4px">The logo's gradient pair is not used in UI chrome. In documents, green and blue appear only as the <b>symbiont</b> and <b>modality</b> domain hues, desaturated.</div></div></body></html>
