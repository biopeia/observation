<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;margin:0}.mono{font-family:var(--font-mono);font-variation-settings:"wdth" 87.5;font-size:10.5px;color:var(--ink-3)}.lbl{font:var(--type-label);font-variation-settings:"wdth" 87.5;text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--ink-3)}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:56px;box-shadow:inset 0 0 0 1px rgba(24,32,43,.08)}.grid{display:grid;gap:12px}</style></head><body><div style="display:flex;align-items:flex-end;gap:18px"><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><div style="width:var(--space-1);height:var(--space-1);background:var(--ink-1)"></div><span class="mono">1</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><div style="width:var(--space-2);height:var(--space-2);background:var(--ink-1)"></div><span class="mono">2</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><div style="width:var(--space-3);height:var(--space-3);background:var(--ink-1)"></div><span class="mono">3</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><div style="width:var(--space-4);height:var(--space-4);background:var(--ink-1)"></div><span class="mono">4</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><div style="width:var(--space-5);height:var(--space-5);background:var(--ink-1)"></div><span class="mono">5</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><div style="width:var(--space-6);height:var(--space-6);background:var(--ink-1)"></div><span class="mono">6</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><div style="width:var(--space-7);height:var(--space-7);background:var(--ink-1)"></div><span class="mono">7</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><div style="width:var(--space-8);height:var(--space-8);background:var(--ink-1)"></div><span class="mono">8</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><div style="width:var(--space-9);height:var(--space-9);background:var(--ink-1)"></div><span class="mono">9</span></div></div><div class="mono" style="margin-top:12px">4 · 8 · 12 · 16 · 24 · 32 · 48 · 64 · 96 px — section break = --space-8</div></body></html>
