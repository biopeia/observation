<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;margin:0}.mono{font-family:var(--font-mono);font-variation-settings:"wdth" 87.5;font-size:10.5px;color:var(--ink-3)}.lbl{font:var(--type-label);font-variation-settings:"wdth" 87.5;text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--ink-3)}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:56px;box-shadow:inset 0 0 0 1px rgba(24,32,43,.08)}.grid{display:grid;gap:12px}</style></head><body><div style="background:var(--night-0);padding:16px;display:grid;grid-template-columns:repeat(7,1fr);gap:10px"><div class="sw"><div style="height:44px;background:var(--night-0);box-shadow:inset 0 0 0 1px #2c373e"></div><div class="mono" style="color:var(--night-ink-2)">--night-0</div></div><div class="sw"><div style="height:44px;background:var(--night-1);box-shadow:inset 0 0 0 1px #2c373e"></div><div class="mono" style="color:var(--night-ink-2)">--night-1</div></div><div class="sw"><div style="height:44px;background:var(--night-2);box-shadow:inset 0 0 0 1px #2c373e"></div><div class="mono" style="color:var(--night-ink-2)">--night-2</div></div><div class="sw"><div style="height:44px;background:var(--night-rule);box-shadow:inset 0 0 0 1px #2c373e"></div><div class="mono" style="color:var(--night-ink-2)">--night-rule</div></div><div class="sw"><div style="height:44px;background:var(--night-ink-1);box-shadow:inset 0 0 0 1px #2c373e"></div><div class="mono" style="color:var(--night-ink-2)">--night-ink-1</div></div><div class="sw"><div style="height:44px;background:var(--night-ink-2);box-shadow:inset 0 0 0 1px #2c373e"></div><div class="mono" style="color:var(--night-ink-2)">--night-ink-2</div></div><div class="sw"><div style="height:44px;background:var(--night-ink-3);box-shadow:inset 0 0 0 1px #2c373e"></div><div class="mono" style="color:var(--night-ink-2)">--night-ink-3</div></div></div></body></html>
