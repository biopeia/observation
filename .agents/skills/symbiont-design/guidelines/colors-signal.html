<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;margin:0}.mono{font-family:var(--font-mono);font-variation-settings:"wdth" 87.5;font-size:10.5px;color:var(--ink-3)}.lbl{font:var(--type-label);font-variation-settings:"wdth" 87.5;text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--ink-3)}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:56px;box-shadow:inset 0 0 0 1px rgba(24,32,43,.08)}.grid{display:grid;gap:12px}</style></head><body><div class="grid" style="grid-template-columns:repeat(4,1fr) 2fr"><div class="sw"><div class="chip" style="background:var(--signal-warn)"></div><div style="font:500 12px/1.2 var(--font-sans)">warn</div><div class="mono">--signal-warn</div></div><div class="sw"><div class="chip" style="background:var(--signal-warn-ink)"></div><div style="font:500 12px/1.2 var(--font-sans)">warn ink</div><div class="mono">--signal-warn-ink</div></div><div class="sw"><div class="chip" style="background:var(--signal-warn-rule)"></div><div style="font:500 12px/1.2 var(--font-sans)">warn rule</div><div class="mono">--signal-warn-rule</div></div><div class="sw"><div class="chip" style="background:var(--signal-warn-tint)"></div><div style="font:500 12px/1.2 var(--font-sans)">warn tint</div><div class="mono">--signal-warn-tint</div></div><div style="border-top:2px solid var(--signal-warn);background:var(--signal-warn-tint);padding:10px 12px;align-self:start"><div class="lbl" style="color:var(--signal-warn-ink)">Warning</div><div style="font:var(--type-meta);margin-top:4px">E8 Label Invariance fails — open P0 integrity issue.</div></div></div></body></html>
