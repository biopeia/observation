<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;margin:0}.mono{font-family:var(--font-mono);font-variation-settings:"wdth" 87.5;font-size:10.5px;color:var(--ink-3)}.lbl{font:var(--type-label);font-variation-settings:"wdth" 87.5;text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--ink-3)}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:56px;box-shadow:inset 0 0 0 1px rgba(24,32,43,.08)}.grid{display:grid;gap:12px}</style></head><body><div class="grid" style="grid-template-columns:repeat(5,1fr)"><div class="sw"><div style="display:grid;grid-template-rows:56px 18px 18px"><div style="background:var(--dom-symbiont)"></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr"><div style="background:var(--dom-symbiont-ink)"></div><div style="background:var(--dom-symbiont-rule)"></div><div style="background:var(--dom-symbiont-tint)"></div></div></div><div style="font:600 13px/1.2 var(--font-sans);color:var(--dom-symbiont-ink)">symbiont</div><div style="font:var(--type-meta);font-size:12px;color:var(--ink-3)">organism / research subject</div><div class="mono">--dom-symbiont</div></div><div class="sw"><div style="display:grid;grid-template-rows:56px 18px 18px"><div style="background:var(--dom-embodiment)"></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr"><div style="background:var(--dom-embodiment-ink)"></div><div style="background:var(--dom-embodiment-rule)"></div><div style="background:var(--dom-embodiment-tint)"></div></div></div><div style="font:600 13px/1.2 var(--font-sans);color:var(--dom-embodiment-ink)">embodiment</div><div style="font:var(--type-meta);font-size:12px;color:var(--ink-3)">organism ↔ body coupling</div><div class="mono">--dom-embodiment</div></div><div class="sw"><div style="display:grid;grid-template-rows:56px 18px 18px"><div style="background:var(--dom-modality)"></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr"><div style="background:var(--dom-modality-ink)"></div><div style="background:var(--dom-modality-rule)"></div><div style="background:var(--dom-modality-tint)"></div></div></div><div style="font:600 13px/1.2 var(--font-sans);color:var(--dom-modality-ink)">modality</div><div style="font:var(--type-meta);font-size:12px;color:var(--ink-3)">signal channels</div><div class="mono">--dom-modality</div></div><div class="sw"><div style="display:grid;grid-template-rows:56px 18px 18px"><div style="background:var(--dom-environment)"></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr"><div style="background:var(--dom-environment-ink)"></div><div style="background:var(--dom-environment-rule)"></div><div style="background:var(--dom-environment-tint)"></div></div></div><div style="font:600 13px/1.2 var(--font-sans);color:var(--dom-environment-ink)">environment</div><div style="font:var(--type-meta);font-size:12px;color:var(--ink-3)">external laws & ground truth</div><div class="mono">--dom-environment</div></div><div class="sw"><div style="display:grid;grid-template-rows:56px 18px 18px"><div style="background:var(--dom-lab)"></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr"><div style="background:var(--dom-lab-ink)"></div><div style="background:var(--dom-lab-rule)"></div><div style="background:var(--dom-lab-tint)"></div></div></div><div style="font:600 13px/1.2 var(--font-sans);color:var(--dom-lab-ink)">lab</div><div style="font:var(--type-meta);font-size:12px;color:var(--ink-3)">composition & observation</div><div class="mono">--dom-lab</div></div></div></body></html>
