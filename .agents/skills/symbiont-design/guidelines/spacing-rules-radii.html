<!-- @dsCard group="Spacing" viewport="700x170" name="Rules & radii" subtitle="Rules instead of boxes; 0–3px radii; no shadows in documents" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;margin:0}.mono{font-family:var(--font-mono);font-variation-settings:"wdth" 87.5;font-size:10.5px;color:var(--ink-3)}.lbl{font:var(--type-label);font-variation-settings:"wdth" 87.5;text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--ink-3)}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:56px;box-shadow:inset 0 0 0 1px rgba(24,32,43,.08)}.grid{display:grid;gap:12px}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px"><div><div style="border-top:1px solid var(--rule-1);margin-bottom:8px"></div><span class="mono">hairline</span></div><div><div style="border-top:1px solid var(--rule-2);margin-bottom:8px"></div><span class="mono">rule</span></div><div><div style="border-top:1px solid var(--rule-ink);margin-bottom:8px"></div><span class="mono">ink rule</span></div><div><div style="border-top:2px solid var(--rule-ink);margin-bottom:8px"></div><span class="mono">heavy · decisions</span></div><div><div style="border-top:1px dashed var(--rule-3);margin-bottom:8px"></div><span class="mono">dashed · hypothesis</span></div><div><div style="height:16px;background:repeating-linear-gradient(135deg,var(--paper-1) 0 6px,var(--paper-0) 6px 12px);margin-bottom:8px"></div><span class="mono">hatched · superseded</span></div><div><div style="height:18px;box-shadow:inset 0 0 0 1px var(--rule-3);border-radius:2px;margin-bottom:8px"></div><span class="mono">radius-1 · 2px</span></div><div><div style="height:18px;box-shadow:inset 0 0 0 1px var(--rule-3);margin-bottom:8px"></div><span class="mono">radius-0 · default</span></div></div></body></html>
