<!-- @dsCard group="Colors" viewport="700x150" name="Paper & rules" subtitle="Warm near-white grounds; hairlines carry structure" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;margin:0}.mono{font-family:var(--font-mono);font-variation-settings:"wdth" 87.5;font-size:10.5px;color:var(--ink-3)}.lbl{font:var(--type-label);font-variation-settings:"wdth" 87.5;text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--ink-3)}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:56px;box-shadow:inset 0 0 0 1px rgba(24,32,43,.08)}.grid{display:grid;gap:12px}</style></head><body><div class="grid" style="grid-template-columns:repeat(8,1fr)"><div class="sw"><div class="chip" style="background:var(--paper-0)"></div><div style="font:500 12px/1.2 var(--font-sans)">page</div><div class="mono">--paper-0</div></div><div class="sw"><div class="chip" style="background:var(--paper-1)"></div><div style="font:500 12px/1.2 var(--font-sans)">aside</div><div class="mono">--paper-1</div></div><div class="sw"><div class="chip" style="background:var(--paper-2)"></div><div style="font:500 12px/1.2 var(--font-sans)">code</div><div class="mono">--paper-2</div></div><div class="sw"><div class="chip" style="background:var(--paper-3)"></div><div style="font:500 12px/1.2 var(--font-sans)">highlight</div><div class="mono">--paper-3</div></div><div class="sw"><div class="chip" style="background:var(--rule-1)"></div><div style="font:500 12px/1.2 var(--font-sans)">hairline</div><div class="mono">--rule-1</div></div><div class="sw"><div class="chip" style="background:var(--rule-2)"></div><div style="font:500 12px/1.2 var(--font-sans)">rule</div><div class="mono">--rule-2</div></div><div class="sw"><div class="chip" style="background:var(--rule-3)"></div><div style="font:500 12px/1.2 var(--font-sans)">strong</div><div class="mono">--rule-3</div></div><div class="sw"><div class="chip" style="background:var(--rule-ink)"></div><div style="font:500 12px/1.2 var(--font-sans)">ink rule</div><div class="mono">--rule-ink</div></div></div></body></html>
