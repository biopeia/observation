<!-- @dsCard group="Brand" viewport="700x150" name="Domain glyphs" subtitle="Shape + hue per domain so the system survives greyscale and print" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;margin:0}.mono{font-family:var(--font-mono);font-variation-settings:"wdth" 87.5;font-size:10.5px;color:var(--ink-3)}.lbl{font:var(--type-label);font-variation-settings:"wdth" 87.5;text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--ink-3)}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:56px;box-shadow:inset 0 0 0 1px rgba(24,32,43,.08)}.grid{display:grid;gap:12px}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:16px"><div><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="var(--dom-symbiont)"/></svg><div style="font:600 13px/1.2 var(--font-sans);color:var(--dom-symbiont-ink);margin-top:10px">symbiont</div><div style="font:var(--type-meta);font-size:12px;color:var(--ink-3)">circle · the organism</div></div><div><svg width="24" height="24" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" fill="var(--dom-embodiment)"/></svg><div style="font:600 13px/1.2 var(--font-sans);color:var(--dom-embodiment-ink);margin-top:10px">embodiment</div><div style="font:var(--type-meta);font-size:12px;color:var(--ink-3)">square · the body</div></div><div><svg width="24" height="24" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" fill="var(--dom-modality)" transform="rotate(45 12 12)"/></svg><div style="font:600 13px/1.2 var(--font-sans);color:var(--dom-modality-ink);margin-top:10px">modality</div><div style="font:var(--type-meta);font-size:12px;color:var(--ink-3)">diamond · a channel</div></div><div><svg width="24" height="24" viewBox="0 0 24 24"><rect x="1" y="13" width="22" height="6" fill="var(--dom-environment)"/><rect x="5" y="5" width="14" height="5" fill="var(--dom-environment)"/></svg><div style="font:600 13px/1.2 var(--font-sans);color:var(--dom-environment-ink);margin-top:10px">environment</div><div style="font:var(--type-meta);font-size:12px;color:var(--ink-3)">ground · the world</div></div><div><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="var(--dom-lab)" stroke-width="2.5"/></svg><div style="font:600 13px/1.2 var(--font-sans);color:var(--dom-lab-ink);margin-top:10px">lab</div><div style="font:var(--type-meta);font-size:12px;color:var(--ink-3)">ring · the observer</div></div></div></body></html>
